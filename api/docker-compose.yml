services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: herobet
      POSTGRES_USER: herobet
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-herobet-only}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - herobet-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U herobet -d herobet"]
      interval: 3s
      timeout: 3s
      retries: 20

  migrate:
    build: .
    command: ["npm", "run", "migrate"]
    environment:
      DATABASE_URL: postgres://herobet:${POSTGRES_PASSWORD:-local-herobet-only}@postgres:5432/herobet
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build: .
    command: ["npm", "start"]
    environment:
      DATABASE_URL: postgres://herobet:${POSTGRES_PASSWORD:-local-herobet-only}@postgres:5432/herobet
      PORT: 3001
      HOST: 0.0.0.0
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:5173}
    ports:
      - "3001:3001"
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  round-worker:
    build: .
    command: ["npm", "run", "worker"]
    environment:
      DATABASE_URL: postgres://herobet:${POSTGRES_PASSWORD:-local-herobet-only}@postgres:5432/herobet
      ROUND_WORKER_POLL_MS: 500
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  herobet-postgres:
